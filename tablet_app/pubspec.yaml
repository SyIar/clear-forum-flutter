name: forum_tablet
description: Four independent tablet forum clients with private download libraries.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  tieba_lite:
    path: packages/tieba
  dio: ^5.11.1
  html: ^0.15.7
  crypto: ^3.0.7
  shared_preferences: ^2.5.5
  flutter_inappwebview: ^6.1.5
  cached_network_image: ^4.0.2
  path_provider: ^2.1.6
  video_player: ^2.14.0
  share_plus: ^13.3.0
  url_launcher: ^6.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/l10n/
    - assets/emoticons/
