name: Four Android tablet apps
on:
  workflow_dispatch:
  push:
    branches: [feat/android-tablet-apps]
    paths: ['tablet_app/**', '.github/workflows/android-tablet.yml']
permissions:
  contents: read
concurrency:
  group: tablet-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tablet_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        forum: [tieba, simp, south, bookhouse]
    defaults:
      run:
        working-directory: tablet_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build unsigned tablet APK
        run: flutter build apk --release --flavor ${{ matrix.forum }} --target-platform android-arm64 --build-number ${{ github.run_number }} --no-pub
      - name: Verify alignment and package identity
        run: |
          APK=build/app/outputs/flutter-apk/app-${{ matrix.forum }}-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -10
          mkdir -p artifacts
          cp "$APK" artifacts/
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: forum-tablet-${{ matrix.forum }}-${{ github.run_number }}
          path: tablet_app/artifacts/
          if-no-files-found: error
          retention-days: 14
