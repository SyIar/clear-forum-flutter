name: ForumLite
options:
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: '26.0'
packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    exactVersion: 2.13.9
  SwiftProtobuf:
    url: https://github.com/apple/swift-protobuf.git
    exactVersion: 1.38.1
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGNING_ALLOWED: NO
    MARKETING_VERSION: '0.3.0'
    CURRENT_PROJECT_VERSION: '1001'
targets:
  ForumLite:
    type: application
    platform: iOS
    sources:
      - App
      - Core
      - path: Resources
        buildPhase: resources
        excludes:
          - Fonts/README.md
      - ../ios/Runner/MediaSupport.swift
      - path: ../ios/Runner/Assets.xcassets
        buildPhase: resources
      - path: ../ios/Runner/MediaProbe.js
        buildPhase: resources
    dependencies:
      - package: SwiftSoup
      - target: TiebaFeature
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sylar.clearforum
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Forum Lite
        INFOPLIST_KEY_CFBundleDevelopmentRegion: zh-Hans
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Save downloaded videos to your photo library.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CADisableMinimumFrameDurationOnPhone: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  TiebaFeature:
    type: framework
    platform: iOS
    sources:
      - Tieba/App
      - Tieba/Core
      - path: Tieba/Resources
        buildPhase: resources
        excludes:
          - emoticons
      - path: Tieba/Resources/emoticons
        type: folder
        buildPhase: resources
    dependencies:
      - package: SwiftProtobuf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sylar.forumlite.tieba
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
schemes:
  ForumLite:
    build:
      targets:
        ForumLite: all
