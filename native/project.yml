name: SimpLite
options:
  deploymentTarget:
    iOS: '26.0'
packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    exactVersion: 2.13.9
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGNING_ALLOWED: NO
    MARKETING_VERSION: '0.2.0'
    CURRENT_PROJECT_VERSION: '1001'
targets:
  SimpLite:
    type: application
    platform: iOS
    sources:
      - App
      - Core
      - ../ios/Runner/MediaSupport.swift
      - ../ios/Runner/MediaPlayerController.swift
      - path: ../ios/Runner/Assets.xcassets
        buildPhase: resources
      - path: ../ios/Runner/MediaProbe.js
        buildPhase: resources
    dependencies:
      - package: SwiftSoup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sylar.clearforum
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: simp lite
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CADisableMinimumFrameDurationOnPhone: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
schemes:
  SimpLite:
    build:
      targets:
        SimpLite: all
